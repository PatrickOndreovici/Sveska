openapi: 3.1.0
info:
  title: Sveska API
  version: 0.6.0
  description: |
    REST API for the language-learning workspace. This file is the contract:
    endpoints are added here first, then implemented in backend/internal/httpapi
    and consumed by the frontend.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
security: []
tags:
  - name: system
    description: Operational endpoints.
  - name: auth
    description: Accounts and sessions.
  - name: vocabulary
    description: |
      A student's own list of words. Every entry is private to its owner;
      teachers get 403 `students_only`.
  - name: lessons
    description: |
      A student's lessons and the PDFs uploaded into them. Every lesson and
      document is private to its owner; someone else's id answers 404, and
      teachers get 403 `students_only`.
  - name: annotations
    description: |
      Highlights on a student's own PDFs, each with an optional note. They
      are anchored by page number and rectangles in 0–1 page coordinates, so
      they fit the page at any zoom. Private to their owner, like documents.
  - name: drawings
    description: |
      Writing and drawing on a student's own PDFs: strokes drawn by hand,
      such as a circle around an answer, and text typed onto a page, such as
      the answer to a fill-in exercise. Both are placed in 0–1 page
      coordinates, like highlights, and are private to their owner.
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Report API and database reachability.
      responses:
        "200":
          description: The API is running and the database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                database: ok
        "503":
          description: The API is running but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable
                database: unreachable
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and log in.
      description: |
        Creates a student or teacher account. The role cannot be changed later.
        On success the response sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Account created and logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "409":
          description: An account with this email already exists (code `email_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Log in with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: |
            Email or password is incorrect (code `invalid_credentials`). The
            response is identical whether or not the email has an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: End the current session.
      description: Always succeeds, even without a session, and clears the session cookie.
      responses:
        "204":
          description: Logged out.
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Return the logged-in user.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/vocabulary:
    get:
      tags: [vocabulary]
      operationId: listVocabulary
      summary: List one page of the user's words.
      description: |
        Returns at most `pageSize` entries plus the totals needed for paging.
        Every parameter is optional; leaving one out applies its default.
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          description: |
            Case- and diacritic-insensitive substring of the word, its
            translation, plural, aspect pair or adjective forms, so `cevapi`
            finds `ćevapi`. Empty means no search.
          schema:
            type: string
            maxLength: 200
        - name: days
          in: query
          description: Only entries added in the last N days. 0 means all time.
          schema:
            type: integer
            minimum: 0
            maximum: 3650
            default: 0
        - name: sort
          in: query
          description: "`newest` first, or `az` in Serbian alphabetical order (c, č, ć, d, dž, đ, …)."
          schema:
            $ref: "#/components/schemas/VocabularySort"
        - name: page
          in: query
          description: 1-based page number. A page past the end returns no entries.
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "422":
          $ref: "#/components/responses/Invalid"
    post:
      tags: [vocabulary]
      operationId: createVocabularyEntry
      summary: Add a word, typed in or saved from a highlight.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewVocabularyEntryInput"
      responses:
        "201":
          description: The word was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyEntryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/AnnotationNotFound"
        "409":
          $ref: "#/components/responses/DuplicateEntry"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/vocabulary/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [vocabulary]
      operationId: updateVocabularyEntry
      summary: Replace a word.
      description: |
        Replaces every editable field. A field left out of the body is
        cleared, the same as sending it empty.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyEntryInput"
      responses:
        "200":
          description: The updated word.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyEntryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/EntryNotFound"
        "409":
          $ref: "#/components/responses/DuplicateEntry"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [vocabulary]
      operationId: deleteVocabularyEntry
      summary: Delete a word.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The word was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/EntryNotFound"
  /api/lessons:
    get:
      tags: [lessons]
      operationId: listLessons
      summary: List the user's lessons, newest first.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every lesson of the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
    post:
      tags: [lessons]
      operationId: createLesson
      summary: Create a lesson.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "201":
          description: The new lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/lessons/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lessons]
      operationId: getLesson
      summary: Get a lesson with its PDFs in upload order.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The lesson and its documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "404":
          $ref: "#/components/responses/LessonNotFound"
    put:
      tags: [lessons]
      operationId: updateLesson
      summary: Replace a lesson's title and description.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "200":
          description: The updated lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/LessonNotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [lessons]
      operationId: deleteLesson
      summary: Delete a lesson and every PDF in it.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The lesson and its documents were deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/LessonNotFound"
  /api/lessons/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [lessons]
      operationId: uploadDocument
      summary: Upload a PDF into a lesson.
      description: |
        The file must start with `%PDF-` and be at most 20 MB; the browser's
        claimed content type is ignored. The title is the file name without
        its `.pdf` extension.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF. Other form fields are ignored.
      responses:
        "201":
          description: The stored document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/LessonNotFound"
        "422":
          description: |
            Not multipart (`unsupported_content_type`), unreadable
            (`invalid_multipart`), or `validation_failed` with a `file`
            problem: missing, not a PDF, or over 20 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lessons]
      operationId: getDocument
      summary: Get a document's details and its lesson.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
    delete:
      tags: [lessons]
      operationId: deleteDocument
      summary: Delete a document.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The document was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
  /api/documents/{id}/file:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [lessons]
      operationId: downloadDocument
      summary: Download the PDF bytes.
      description: |
        Sent as an attachment with a sandboxing Content-Security-Policy, so
        opening the URL directly downloads the file rather than rendering it
        on the app's origin. Supports Range requests.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The PDF.
          headers:
            Content-Disposition:
              description: "`attachment` with the document title as the file name."
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range of the PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
  /api/documents/{id}/annotations:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [annotations]
      operationId: listAnnotations
      summary: List a document's annotations in reading order.
      description: By page number, then oldest first.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every annotation on the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
    post:
      tags: [annotations]
      operationId: createAnnotation
      summary: Highlight text on a page, with an optional note.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationInput"
      responses:
        "201":
          description: The new annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/annotations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [annotations]
      operationId: updateAnnotationNote
      summary: Replace an annotation's note.
      description: |
        The note is the only thing that changes; an empty note leaves a plain
        highlight. The highlighted text and its place stay as they are.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationNoteInput"
      responses:
        "200":
          description: The updated annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/AnnotationNotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [annotations]
      operationId: deleteAnnotation
      summary: Delete an annotation.
      description: Words saved from it stay in the vocabulary and lose only their source.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The annotation was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/AnnotationNotFound"
  /api/documents/{id}/strokes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [drawings]
      operationId: listStrokes
      summary: List a document's strokes.
      description: By page number, then in the order they were drawn.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every stroke on the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrokeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
    post:
      tags: [drawings]
      operationId: createStroke
      summary: Draw a stroke on a page.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrokeInput"
      responses:
        "201":
          description: The new stroke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrokeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/strokes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [drawings]
      operationId: deleteStroke
      summary: Erase a stroke.
      description: A stroke never changes otherwise; it is drawn or erased.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The stroke was erased.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/StrokeNotFound"
  /api/documents/{id}/text-boxes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [drawings]
      operationId: listTextBoxes
      summary: List the text typed onto a document.
      description: By page number, then in the order it was added.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every text box on the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextBoxList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnly"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
    post:
      tags: [drawings]
      operationId: createTextBox
      summary: Type text onto a page.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTextBoxInput"
      responses:
        "201":
          description: The new text box.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextBoxEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/DocumentNotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/text-boxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [drawings]
      operationId: updateTextBox
      summary: Replace a text box's text, colour and place on its page.
      description: The page it is on does not change.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextBoxInput"
      responses:
        "200":
          description: The updated text box.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextBoxEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/TextBoxNotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [drawings]
      operationId: deleteTextBox
      summary: Delete a text box.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The text box was deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/StudentsOnlyOrForbiddenOrigin"
        "404":
          $ref: "#/components/responses/TextBoxNotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sveska_session
      description: |
        Opaque session token set by sign-up and log-in. HttpOnly, SameSite=Lax,
        Secure outside local development, valid for 30 days.
  headers:
    SessionCookie:
      description: Sets the `sveska_session` cookie.
      schema:
        type: string
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: No valid session (code `unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: |
        The request body is malformed (`invalid_json`, `unsupported_content_type`)
        or fails validation (`validation_failed`, with per-field messages in `fields`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrigin:
      description: |
        A state-changing request came from a foreign Origin (code `forbidden_origin`).
        Requests without an Origin header (non-browser clients) are allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EntryNotFound:
      description: |
        No such entry among the user's own (code `entry_not_found`). Another
        user's entry and a malformed id get the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StudentsOnly:
      description: |
        The caller is logged in but is not a student (code `students_only`).
        Lessons, documents and vocabulary are a student's own material.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StudentsOnlyOrForbiddenOrigin:
      description: |
        The caller is not a student (code `students_only`), or the request
        came from a foreign Origin (code `forbidden_origin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AnnotationNotFound:
      description: |
        No such annotation among the user's own (code `annotation_not_found`).
        Another user's annotation and a malformed id get the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StrokeNotFound:
      description: |
        No such stroke among the user's own (code `stroke_not_found`).
        Another user's stroke and a malformed id get the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TextBoxNotFound:
      description: |
        No such text box among the user's own (code `text_box_not_found`).
        Another user's text box and a malformed id get the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LessonNotFound:
      description: |
        No such lesson among the user's own (code `lesson_not_found`).
        Another user's lesson and a malformed id get the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DocumentNotFound:
      description: |
        No such document among the user's own (code `document_not_found`).
        Another user's document and a malformed id get the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DuplicateEntry:
      description: |
        The user already has this word with this translation (code
        `duplicate_entry`). The word is compared ignoring case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unreachable]
    Role:
      type: string
      enum: [student, teacher]
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName, role]
      properties:
        email:
          type: string
          maxLength: 254
          example: ana@example.com
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          example: Ana Petrović
        role:
          $ref: "#/components/schemas/Role"
    LogInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    PartOfSpeech:
      description: Empty when not set.
      type: string
      enum: ["", noun, verb, adjective, other]
    Gender:
      description: Nouns only. Empty when not set.
      type: string
      enum: ["", masculine, feminine, neuter]
    Aspect:
      description: Verbs only. Empty when not set.
      type: string
      enum: ["", imperfective, perfective, biaspectual]
    VocabularySort:
      type: string
      enum: [newest, az]
      default: newest
    VocabularyEntryInput:
      description: The body of PUT /api/vocabulary/{id}, which replaces every field.
      allOf:
        - $ref: "#/components/schemas/VocabularyEntryFields"
      unevaluatedProperties: false
    NewVocabularyEntryInput:
      description: |
        The body of POST /api/vocabulary. A word saved from a PDF also names
        the highlight it was selected from; the source is set only here.
      allOf:
        - $ref: "#/components/schemas/VocabularyEntryFields"
      properties:
        sourceAnnotationId:
          type: string
          format: uuid
          description: One of the user's own annotations. Leave out for a typed word.
      unevaluatedProperties: false
    VocabularyEntryFields:
      description: |
        The fields a user types in. Grammar fields are only allowed for their
        part of speech: gender and plural for nouns, aspect and aspect pair
        for verbs, feminine and neuter forms for adjectives. Text is trimmed.
      type: object
      required: [term, translation]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 200
          example: kuća
        translation:
          type: string
          minLength: 1
          maxLength: 200
          example: house
        notes:
          type: string
          maxLength: 2000
        example:
          type: string
          maxLength: 500
          example: Idem kući.
        partOfSpeech:
          $ref: "#/components/schemas/PartOfSpeech"
        gender:
          $ref: "#/components/schemas/Gender"
        plural:
          type: string
          maxLength: 200
          example: kuće
        aspect:
          $ref: "#/components/schemas/Aspect"
        aspectPair:
          type: string
          maxLength: 200
        feminineForm:
          type: string
          maxLength: 200
        neuterForm:
          type: string
          maxLength: 200
    VocabularyEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - term
        - translation
        - notes
        - example
        - partOfSpeech
        - gender
        - plural
        - aspect
        - aspectPair
        - feminineForm
        - neuterForm
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        term:
          type: string
        translation:
          type: string
        notes:
          type: string
        example:
          type: string
        partOfSpeech:
          $ref: "#/components/schemas/PartOfSpeech"
        gender:
          $ref: "#/components/schemas/Gender"
        plural:
          type: string
        aspect:
          $ref: "#/components/schemas/Aspect"
        aspectPair:
          type: string
        feminineForm:
          type: string
        neuterForm:
          type: string
        source:
          description: Where the word was saved from; null for a typed word.
          oneOf:
            - $ref: "#/components/schemas/EntrySource"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VocabularyEntryEnvelope:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/VocabularyEntry"
    VocabularyPage:
      type: object
      additionalProperties: false
      required: [entries, total, unfilteredTotal, page, pageSize]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyEntry"
        total:
          type: integer
          description: Entries matching the search and time range, across all pages.
        unfilteredTotal:
          type: integer
          description: All of the user's entries, ignoring the search and time range.
        page:
          type: integer
        pageSize:
          type: integer
    LessonInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Lekcija 3 – Padeži
        description:
          type: string
          maxLength: 2000
    Lesson:
      type: object
      additionalProperties: false
      required: [id, title, description, documentCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        documentCount:
          type: integer
          description: How many PDFs the lesson holds.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LessonEnvelope:
      type: object
      additionalProperties: false
      required: [lesson]
      properties:
        lesson:
          $ref: "#/components/schemas/Lesson"
    LessonList:
      type: object
      additionalProperties: false
      required: [lessons]
      properties:
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
    LessonDetail:
      type: object
      additionalProperties: false
      required: [lesson, documents]
      properties:
        lesson:
          $ref: "#/components/schemas/Lesson"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
    Document:
      type: object
      additionalProperties: false
      required: [id, lessonId, title, byteSize, createdAt]
      properties:
        id:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        title:
          type: string
          description: The uploaded file's name without `.pdf`.
        byteSize:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    DocumentEnvelope:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/Document"
    DocumentDetail:
      type: object
      additionalProperties: false
      required: [document, lesson]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        lesson:
          type: object
          additionalProperties: false
          required: [id, title]
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
    EntrySource:
      type: object
      additionalProperties: false
      required: [annotationId, documentId, documentTitle, pageNumber]
      properties:
        annotationId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        documentTitle:
          type: string
        pageNumber:
          type: integer
          minimum: 1
    Rect:
      description: |
        One rectangle of a highlight in 0–1 page coordinates: x and y from the
        page's top-left corner, all values fractions of the page's width and
        height. It must lie within the page.
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    AnnotationInput:
      type: object
      additionalProperties: false
      required: [pageNumber, rects, quote]
      properties:
        pageNumber:
          type: integer
          minimum: 1
          maximum: 100000
        rects:
          description: One rectangle per line of the selection.
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/Rect"
        quote:
          type: string
          minLength: 1
          maxLength: 2000
          description: The selected text. Trimmed.
          example: Dobar dan
        note:
          type: string
          maxLength: 5000
    AnnotationNoteInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          maxLength: 5000
    Annotation:
      type: object
      additionalProperties: false
      required: [id, documentId, pageNumber, rects, quote, note, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        pageNumber:
          type: integer
        rects:
          type: array
          items:
            $ref: "#/components/schemas/Rect"
        quote:
          type: string
        note:
          type: string
          description: Empty for a plain highlight.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AnnotationEnvelope:
      type: object
      additionalProperties: false
      required: [annotation]
      properties:
        annotation:
          $ref: "#/components/schemas/Annotation"
    AnnotationList:
      type: object
      additionalProperties: false
      required: [annotations]
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/Annotation"
    InkColor:
      type: string
      enum: [black, blue, red]
    Point:
      description: One point of a stroke in 0–1 page coordinates, from the page's top-left corner.
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
    StrokeInput:
      type: object
      additionalProperties: false
      required: [pageNumber, color, points]
      properties:
        pageNumber:
          type: integer
          minimum: 1
          maximum: 100000
        color:
          $ref: "#/components/schemas/InkColor"
        points:
          description: The points of one movement of the pen, in order. A single point is a dot.
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Point"
    Stroke:
      type: object
      additionalProperties: false
      required: [id, documentId, pageNumber, color, points, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        pageNumber:
          type: integer
        color:
          $ref: "#/components/schemas/InkColor"
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"
        createdAt:
          type: string
          format: date-time
    StrokeEnvelope:
      type: object
      additionalProperties: false
      required: [stroke]
      properties:
        stroke:
          $ref: "#/components/schemas/Stroke"
    StrokeList:
      type: object
      additionalProperties: false
      required: [strokes]
      properties:
        strokes:
          type: array
          items:
            $ref: "#/components/schemas/Stroke"
    TextBoxFields:
      description: |
        What can change about a text box. (x, y) is its top-left corner in
        0–1 page coordinates; the text wraps at the page's right edge.
      type: object
      required: [x, y, text, color]
      properties:
        x:
          type: number
          minimum: 0
          exclusiveMaximum: 1
        y:
          type: number
          minimum: 0
          exclusiveMaximum: 1
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: May span several lines. Trimmed.
          example: kuća
        color:
          $ref: "#/components/schemas/InkColor"
    TextBoxInput:
      description: The body of PUT /api/text-boxes/{id}, which replaces every field.
      allOf:
        - $ref: "#/components/schemas/TextBoxFields"
      unevaluatedProperties: false
    NewTextBoxInput:
      description: The body of POST /api/documents/{id}/text-boxes.
      allOf:
        - $ref: "#/components/schemas/TextBoxFields"
      required: [pageNumber]
      properties:
        pageNumber:
          type: integer
          minimum: 1
          maximum: 100000
      unevaluatedProperties: false
    TextBox:
      type: object
      additionalProperties: false
      required: [id, documentId, pageNumber, x, y, text, color, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        pageNumber:
          type: integer
        x:
          type: number
        y:
          type: number
        text:
          type: string
        color:
          $ref: "#/components/schemas/InkColor"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TextBoxEnvelope:
      type: object
      additionalProperties: false
      required: [textBox]
      properties:
        textBox:
          $ref: "#/components/schemas/TextBox"
    TextBoxList:
      type: object
      additionalProperties: false
      required: [textBoxes]
      properties:
        textBoxes:
          type: array
          items:
            $ref: "#/components/schemas/TextBox"
    Error:
      description: Envelope returned by every non-2xx response except /api/health.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code such as not_found.
            message:
              type: string
              description: Human-readable explanation. Not for programmatic use.
            fields:
              type: object
              description: Per-field problems, present only for `validation_failed`.
              additionalProperties:
                type: string
